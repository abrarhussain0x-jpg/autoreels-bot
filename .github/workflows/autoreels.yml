name: Auto-Reels Bot

on:
  schedule:
    - cron: '0 9,12,15,18,21 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-bot:
    runs-on: ubuntu-22.04
    timeout-minutes: 55

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure cache file exists
        run: |
          mkdir -p cloud/queue
          touch cloud/queue/seen.json

      - name: Fix APT mirrors (CRITICAL)
        run: |
          sudo rm -f /etc/apt/apt-mirrors.txt

          sudo bash -c 'cat > /etc/apt/sources.list <<EOF
deb http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
deb http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
deb http://archive.ubuntu.com/ubuntu jammy-backports main restricted universe multiverse
deb http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse
EOF'

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update

      - name: Install FFmpeg and yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg yt-dlp

      - name: Install bot dependencies
        run: python -m pip install -r cloud/requirements.txt

      - name: Restore seen videos cache
        uses: actions/cache@v4
        with:
          path: cloud/queue/seen.json
          key: seen-videos-${{ github.run_id }}
          restore-keys: seen-videos-

      - name: Run bot
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd cloud
          python main.py --once --no-web

      - name: Save seen videos cache
        if: always()
        uses: actions/cache@v4
        with:
          path: cloud/queue/seen.json
          key: seen-videos-${{ github.run_id }}
