name: Auto-Reels Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg and yt-dlp
        run: |
          sudo apt-get update --fix-missing
          sudo apt-get upgrade -y
          sudo apt-get install -y ffmpeg || sudo apt-get install -y ffmpeg --fix-missing
          pip install yt-dlp

      - name: Install requirements
        run: |
          pip install -r cloud/requirements.txt

      - name: Run bot
        run: |
          python3 cloud/main.py
